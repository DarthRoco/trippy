# Cloudflare Worker for the proxy. Secrets (never in this file): NEBIUS_API_KEY, GOOGLE_MAPS_SERVER_KEY, TAVILY_API_KEY.
name = "trippy-proxy"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[vars]
# Pages URL (production + preview deployments). "trippy.pages.dev" was taken; Cloudflare assigned trippy-c20.
ALLOWED_ORIGINS = "https://trippy-c20.pages.dev,https://*.trippy-c20.pages.dev"

# Daily cap counters (worker.ts, class Caps).
[[durable_objects.bindings]]
name = "CAPS"
class_name = "Caps"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Caps"]
